[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commissioning-ared"
version = "0.1.0"
description = "Pool-phase farthest-first commissioning handed off into streaming A/RED."
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "numpy==1.26.4",
    "scipy==1.13.1",
    "scikit-learn==1.5.2",
    "pandas==2.2.3",
    "matplotlib==3.9.2",
    "seaborn==0.13.2",
    "pyyaml==6.0.2",
    "bidict==0.23.1",
    "tqdm==4.67.1",
    "pillow==11.0.0",
    "torch==2.5.1",
    "transformers==4.46.3",
]

[project.optional-dependencies]
test = ["pytest==8.3.3"]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
