# Small matrix used by `make sweep`. Same methods and stream constructions as
# the full grid, one seed and one kappa, two budgets.
data: NICE
nice_base: 320
nice_min_count: 16
methods:
  - cold_ared
  - random_then_ared
  - farpoint_then_ared
  - oracle_then_ared
streams:
  - stationary
  - late_arrival
t_fracs: [0.20]
B0s: [10, 20]
kappas: [1.0]
l_buf_sizes: [120]
n_rel_classes: [4]
seeds: [0]
query_rule: global_fft
qs_var: 1
k_comp_pts: 2
# Variant 0 forgets oldest points. Variant (3, 0.01) is the streaming default
# and is safe once a frequent class occupies the buffer; the small NICE buffer
# uses plain FIFO so a buffer of singletons cannot spin.
smart_forgetting: [0, 0.01]
out: results/nice_small
